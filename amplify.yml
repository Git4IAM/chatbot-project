version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customRules:
  - source: '/assets/<*>'
    target: '/assets/<*>'
    status: '200'
  - source: '/<*>'
    target: '/index.html'
    status: '200'